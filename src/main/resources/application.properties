spring.application.name=adpilot

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:adpilot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adpilot123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server
server.port=8080

# Meta API
meta.app.id=${META_APP_ID:2180813926051072}
meta.app.secret=${META_APP_SECRET:your_secret}
meta.redirect.uri=${META_REDIRECT_URI:http://localhost:8080/api/meta/callback}

# Twilio
twilio.account.sid=${TWILIO_ACCOUNT_SID:your_sid}
twilio.auth.token=${TWILIO_AUTH_TOKEN:your_token}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
twilio.whatsapp.to=${TWILIO_WHATSAPP_TO:whatsapp:+201037371204}